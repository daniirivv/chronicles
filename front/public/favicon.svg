<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Lienzo del dibujo y cuadro de vista (viewBox="0 0 100 100") -->
<svg 
    width="100" 
    height="100" 
    viewBox="0 0 100 100" 
    xmlns="http://www.w3.org/2000/svg" 
    version="1.1"
>
    <!-- Configura el color naranja Chronicles (#ff9800) -->
    <defs>
        <style type="text/css">
            .chronicles-orange { fill: #ff9800; }
        </style>
    </defs>

    <!-- Portada izquierda (panel naranja) con bordes curvos -->
    <path 
        d="M15,25 Q40,15 50,25 V75 Q40,65 15,75 Z" 
        class="chronicles-orange" 
    />

    <!-- Portada derecha (panel naranja) con bordes curvos -->
    <path 
        d="M85,25 Q60,15 50,25 V75 Q60,65 85,75 Z" 
        class="chronicles-orange" 
    />

    <!-- Área de páginas centrales (blanco) para mayor limpieza -->
    <path 
        d="M25,30 Q50,20 75,30 V70 Q50,60 25,70 Z" 
        fill="white" 
    />

    <!-- Profundidad de la encuadernación (profundidad naranja) para dar volumen -->
    <rect 
        x="49" 
        y="23" 
        width="2" 
        height="54" 
        class="chronicles-orange" 
    />

    <!-- Grupo para las líneas de páginas (gris) para simular texto -->
    <g stroke="#d3d3d3" stroke-width="0.8">
        <!-- Líneas de página izquierda -->
        <line x1="30" y1="35" x2="45" y2="35"/>
        <line x1="30" y1="45" x2="45" y2="45"/>
        <line x1="30" y1="55" x2="45" y2="55"/>
        <line x1="30" y1="65" x2="45" y2="65"/>

        <!-- Líneas de página derecha -->
        <line x1="55" y1="35" x2="70" y2="35"/>
        <line x1="55" y1="45" x2="70" y2="45"/>
        <line x1="55" y1="55" x2="70" y2="55"/>
        <line x1="55" y1="65" x2="70" y2="65"/>
    </g>
</svg>
